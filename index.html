<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/images/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO Meta Tags -->
    <title>FGN Fine Gold Nation - Generational Valuable Heritage</title>
    <meta
      name="description"
      content="Gold is the most valuable asset that has stood the test of time. We offer you the opportunity to buy, store, and trade gold using gold ATMs and mobile applications."
    />
    <meta
      name="keywords"
      content="gold, ATM, trading, investment, Mongolia, FGN, Fine Gold Nation, precious metals"
    />
    <meta name="author" content="FGN Fine Gold Nation" />

    <!-- Open Graph Meta Tags -->
    <!--
      These are the site-wide defaults. Every page that is NOT a generated
      share page falls back to them: the homepage, /about, /locations, the
      /medee listing, and any article whose static share page has not been
      built yet. They must therefore describe the company, never one article.
      Per-article tags are written by scripts/gen-share-pages.mjs into
      dist/medee/<slug>/index.html and override these.
    -->
    <meta
      property="og:title"
      content="Fine Gold Nation | Үе дамжих үнэт өв"
    />
    <meta
      property="og:description"
      content="Алт худалдан авах, хуримтлуулах, биетээр эзэмших үйлчилгээ. FGN алтны киоск болон гар утасны аппликэйшнээр 1, 2.5, 5, 10 граммын цэвэр алтан гулдмай худалдан авч, хуримтлалаа биет алт болгон хүлээн авах боломжтой."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.finegold.mn/" />
    <meta property="og:image" content="https://www.finegold.mn/images/mongon-mod-collection-share-v1.jpg" />
    <meta property="og:image:width" content="1729" />
    <meta property="og:image:height" content="910" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Fine Gold Nation | Үе дамжих үнэт өв"
    />
    <meta
      name="twitter:description"
      content="Алт худалдан авах, хуримтлуулах, биетээр эзэмших үйлчилгээ. FGN алтны киоск болон гар утасны аппликэйшнээр 1, 2.5, 5, 10 граммын цэвэр алтан гулдмай худалдан авч, хуримтлалаа биет алт болгон хүлээн авах боломжтой."
    />
    <meta name="twitter:image" content="https://www.finegold.mn/images/mongon-mod-collection-share-v1.jpg" />

    <!-- Additional Meta Tags -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffd700" />
    <link rel="canonical" href="https://www.finegold.mn/" />
  </head>
